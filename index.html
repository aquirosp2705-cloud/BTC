<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Calculadora BTC</title>

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #222222;
      --muted: #6b7280;
      --border: #d1d5db;
      --btn: #111827;
      --btn-text: #ffffff;
      --ganancia: #0077ff;
      --perdida: #d00000;
      --aviso-bg: #fff4e5;
      --aviso-text: #8a4b00;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #1a1d24;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #374151;
        --btn: #f7931a;
        --btn-text: #111827;
        --ganancia: #4da3ff;
        --perdida: #ff5c5c;
        --aviso-bg: #3a2a12;
        --aviso-text: #ffc978;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      text-align: center;
    }

    .app {
      max-width: 420px;
      margin: auto;
      background: var(--card);
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      text-align: left;
      font-size: 14px;
      color: var(--muted);
      margin-top: 12px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 6px 0 0;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .precio-actual {
      font-size: 22px;
      font-weight: bold;
      margin-top: 22px;
    }

    .fuente {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      min-height: 16px;
    }

    .datos {
      margin-top: 18px;
      text-align: left;
    }

    .fila {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
    }

    .fila span:last-child {
      font-weight: bold;
      text-align: right;
    }

    #resultado {
      margin-top: 22px;
      font-size: 30px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #porcentaje {
      font-size: 20px;
      font-weight: bold;
      margin-top: 4px;
    }

    .ganancia {
      color: var(--ganancia);
    }

    .perdida {
      color: var(--perdida);
    }

    .aviso {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: var(--aviso-bg);
      color: var(--aviso-text);
      font-size: 15px;
      text-align: left;
    }

    .aviso.visible {
      display: block;
    }

    details {
      margin-top: 20px;
      text-align: left;
      font-size: 15px;
      color: var(--muted);
    }

    summary {
      cursor: pointer;
    }

    .extremos {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .extremos-titulo {
      font-size: 17px;
      font-weight: bold;
    }

    .periodos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    button.periodo {
      width: auto;
      margin: 0;
      padding: 8px 14px;
      font-size: 14px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    button.periodo.activo {
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
    }

    /* Si los dos precios no caben lado a lado (pantallas de 320 px o texto agrandado), las tarjetas se apilan. */
    .tarjetas {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .tarjeta {
      flex: 1 1 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
    }

    .tarjeta .etiqueta {
      font-size: 14px;
      color: var(--muted);
    }

    .tarjeta .valor {
      font-size: 19px;
      font-weight: bold;
      margin-top: 4px;
      white-space: nowrap;
    }

    .tarjeta .cuando {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      min-height: 32px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>Calculadora BTC</h1>

    <label for="invertido">Dólares invertidos (USD)</label>
    <input id="invertido" type="text" inputmode="decimal" autocomplete="off" value="5823.91" placeholder="Ej: 5823.91">

    <label for="promedio">Tipo de cambio promedio de compra (USD por BTC)</label>
    <input id="promedio" type="text" inputmode="decimal" autocomplete="off" value="102000" placeholder="Ej: 102000">

    <button id="consultar" type="button">Consultar BTC</button>

    <div id="precio" class="precio-actual"></div>
    <div id="fuente" class="fuente"></div>

    <div id="aviso" class="aviso" role="alert"></div>

    <div id="datos" class="datos" hidden>
      <div class="fila"><span>Invertido</span><span id="totalInvertido"></span></div>
      <div class="fila"><span>Promedio de compra</span><span id="promedioUsado"></span></div>
      <div class="fila"><span>BTC que tienes</span><span id="cantidad"></span></div>
      <div class="fila"><span>Valor actual</span><span id="valorActual"></span></div>
    </div>

    <div id="resultado" aria-live="polite"></div>
    <div id="porcentaje"></div>

    <section class="extremos">
      <div class="extremos-titulo">Precio más bajo y más alto</div>
      <div class="periodos" role="group" aria-label="Periodo">
        <button type="button" class="periodo" data-periodo="86400">24 h</button>
        <button type="button" class="periodo" data-periodo="604800">7 días</button>
        <button type="button" class="periodo" data-periodo="2592000">30 días</button>
        <button type="button" class="periodo" data-periodo="31536000">1 año</button>
      </div>
      <div class="tarjetas">
        <div class="tarjeta">
          <div class="etiqueta"><span class="perdida">▼</span> Más bajo</div>
          <div id="minimoValor" class="valor">…</div>
          <div id="minimoFecha" class="cuando"></div>
        </div>
        <div class="tarjeta">
          <div class="etiqueta"><span class="ganancia">▲</span> Más alto</div>
          <div id="maximoValor" class="valor">…</div>
          <div id="maximoFecha" class="cuando"></div>
        </div>
      </div>
      <div id="extremosFuente" class="fuente"></div>
    </section>

    <details id="manual">
      <summary>¿No carga el precio? Ingrésalo manualmente</summary>
      <label for="precioManual">Precio actual de BTC (USD)</label>
      <input id="precioManual" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej: 83000">
    </details>
  </div>

  <script>
    // Fuentes públicas de precio BTC/USD, todas con CORS abierto y sin API key.
    // Se consultan por grupos: si ninguna del primer grupo responde, se prueba el siguiente.
    const FUENTES = [
      [
        {
          nombre: "Coinbase",
          url: "https://api.coinbase.com/v2/prices/BTC-USD/spot",
          leer: d => d.data.amount
        },
        {
          nombre: "Kraken",
          url: "https://api.kraken.com/0/public/Ticker?pair=XBTUSD",
          leer: d => Object.values(d.result)[0].c[0]
        },
        {
          nombre: "Bitstamp",
          url: "https://www.bitstamp.net/api/v2/ticker/btcusd/",
          leer: d => d.last
        }
      ],
      [
        {
          nombre: "Gemini",
          url: "https://api.gemini.com/v1/pubticker/btcusd",
          leer: d => d.last
        },
        {
          nombre: "mempool.space",
          url: "https://mempool.space/api/v1/prices",
          leer: d => d.USD
        },
        {
          nombre: "Blockchain.com",
          url: "https://blockchain.info/ticker",
          leer: d => d.USD.last
        },
        {
          nombre: "CoinGecko",
          url: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd",
          leer: d => d.bitcoin.usd
        },
        {
          nombre: "Binance (USDT)",
          url: "https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT",
          leer: d => d.price
        }
      ]
    ];

    const INTERVALOS_BINANCE = {
      60: "1m", 180: "3m", 300: "5m", 900: "15m", 1800: "30m", 3600: "1h",
      7200: "2h", 14400: "4h", 21600: "6h", 28800: "8h", 43200: "12h", 86400: "1d"
    };

    // Fuentes de velas históricas para ubicar el precio más bajo y más alto de un periodo.
    // intervalos: duración de vela en segundos (de menor a mayor); maxVelas: tope por consulta.
    // leer() devuelve [{ t: inicio de la vela en segundos, bajo, alto }].
    const HISTORICOS = [
      {
        nombre: "Coinbase",
        intervalos: [60, 300, 900, 3600, 21600, 86400],
        maxVelas: 300,
        // El CDN de Coinbase guarda estas respuestas hasta 5 min; el parámetro "_" obliga a traer datos frescos.
        url: (inicio, fin, g) => "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=" + g +
          "&start=" + new Date(inicio * 1000).toISOString() + "&end=" + new Date(fin * 1000).toISOString() +
          "&_=" + Date.now(),
        leer: d => d.map(v => ({ t: v[0], bajo: v[1], alto: v[2] }))
      },
      {
        nombre: "Bitstamp",
        intervalos: [60, 180, 300, 900, 1800, 3600, 7200, 14400, 21600, 43200, 86400],
        maxVelas: 1000,
        url: (inicio, fin, g) => "https://www.bitstamp.net/api/v2/ohlc/btcusd/?step=" + g + "&start=" + inicio +
          "&limit=" + Math.min(1000, Math.ceil((fin - inicio) / g) + 1),
        leer: d => d.data.ohlc.map(v => ({ t: Number(v.timestamp), bajo: Number(v.low), alto: Number(v.high) }))
      },
      {
        nombre: "Binance (USDT)",
        intervalos: [60, 180, 300, 900, 1800, 3600, 7200, 14400, 21600, 28800, 43200, 86400],
        maxVelas: 1000,
        url: (inicio, fin, g) => "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=" +
          INTERVALOS_BINANCE[g] + "&startTime=" + inicio * 1000 + "&endTime=" + fin * 1000 + "&limit=1000",
        leer: d => d.map(v => ({ t: v[0] / 1000, bajo: Number(v[3]), alto: Number(v[2]) }))
      }
    ];

    const PERIODOS = [86400, 604800, 2592000, 31536000];
    const TIEMPO_MAXIMO_MS = 8000;
    const REFRESCO_MS = 60000;
    const REFRESCO_EXTREMOS_MS = 5 * 60000;
    const CLAVE_GUARDADO = "calculadora-btc";

    const $ = id => document.getElementById(id);

    let ultimoPrecio = null;
    let consultando = false;
    let periodoActual = PERIODOS[0];
    let extremos = null;
    let buscandoExtremos = false;
    let solicitudExtremos = 0;

    const usd = valor => valor.toLocaleString("en-US", {
      style: "currency",
      currency: "USD",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    // Equivalente a Promise.any, que no existe en iOS < 14 ni en Chrome < 85.
    // Resuelve con la primera promesa exitosa y rechaza solo si fallan todas.
    const primeraExitosa = promesas => new Promise((resolver, rechazar) => {
      let pendientes = promesas.length;
      promesas.forEach(p => p.then(resolver, () => {
        if (--pendientes === 0) rechazar(new Error("Ninguna fuente del grupo respondió"));
      }));
    });

    const precioValido = p => Number.isFinite(p) && p >= 1000 && p <= 10000000;

    async function obtenerJSON(url) {
      const control = typeof AbortController === "function" ? new AbortController() : null;
      const temporizador = setTimeout(() => { if (control) control.abort(); }, TIEMPO_MAXIMO_MS);
      try {
        const r = await fetch(url, { cache: "no-store", signal: control ? control.signal : undefined });
        if (!r.ok) throw new Error(url + " respondió " + r.status);
        return await r.json();
      } finally {
        clearTimeout(temporizador);
      }
    }

    async function consultarFuente(fuente) {
      const precio = parseFloat(fuente.leer(await obtenerJSON(fuente.url)));
      if (!precioValido(precio)) throw new Error(fuente.nombre + " devolvió un precio inválido");
      return { precio, fuente: fuente.nombre };
    }

    async function obtenerPrecio() {
      for (const grupo of FUENTES) {
        try {
          return await primeraExitosa(grupo.map(consultarFuente));
        } catch (e) {
          // Ninguna fuente del grupo respondió; se intenta con el siguiente.
        }
      }
      throw new Error("Ninguna fuente de precio respondió");
    }

    // Velas de duración g entre inicio (incluido) y fin (excluido), en varias consultas si superan el tope.
    async function velas(fuente, inicio, fin, g) {
      const paso = (fuente.maxVelas - 1) * g;
      const tramos = [];
      for (let desde = inicio; desde < fin; desde += paso) tramos.push([desde, Math.min(fin, desde + paso)]);
      const partes = await Promise.all(tramos.map(([a, b]) => obtenerJSON(fuente.url(a, b, g)).then(fuente.leer)));
      return [].concat(...partes)
        .filter(v => v.t >= inicio && v.t < fin && precioValido(v.bajo) && precioValido(v.alto))
        .map(v => ({ t: v.t, bajo: v.bajo, alto: v.alto, g }));
    }

    // Como velas(), pero sin perder el tramo inicial: las APIs solo devuelven velas que empiezan en o después
    // de "inicio", así que el trozo hasta la primera vela de duración g se cubre con velas más cortas.
    async function velasCubriendo(fuente, inicio, fin, g) {
      const corte = Math.min(fin, Math.ceil(inicio / g) * g);
      const menor = corte > inicio &&
        fuente.intervalos.find(i => i < g && (corte - inicio) / i < fuente.maxVelas - 1);
      const [cabeza, cuerpo] = await Promise.all([
        menor ? velasCubriendo(fuente, inicio, corte, menor) : [],
        velas(fuente, corte, fin, g)
      ]);
      return cabeza.concat(cuerpo);
    }

    // Ante empates se queda con la vela más reciente: se busca el "último" mínimo o máximo.
    function buscarExtremo(lista, campo, esMejor) {
      let elegido = null;
      for (const v of lista) {
        if (!elegido || esMejor(v[campo], elegido[campo]) || (v[campo] === elegido[campo] && v.t > elegido.t)) {
          elegido = v;
        }
      }
      return elegido;
    }

    const esMenor = (a, b) => a < b;
    const esMayor = (a, b) => a > b;

    // Baja de temporalidad dentro de la vela extrema hasta velas de 1 minuto para dar la hora exacta.
    // Si alguna consulta falla, se queda con la precisión que ya tenía.
    async function afinar(fuente, vela, campo, esMejor) {
      let actual = { t: vela.t, valor: vela[campo], g: vela.g };
      while (true) {
        const menor = fuente.intervalos.find(i => i < actual.g && actual.g / i < fuente.maxVelas - 1);
        if (!menor) break;
        let v;
        try {
          v = buscarExtremo(await velas(fuente, actual.t, actual.t + actual.g, menor), campo, esMejor);
        } catch (e) {
          break;
        }
        // Si las velas finas vienen incompletas y dan un valor menos extremo que la gruesa, no se reemplaza.
        if (!v || esMejor(actual.valor, v[campo])) break;
        actual = { t: v.t, valor: v[campo], g: menor };
      }
      return actual;
    }

    async function calcularExtremos(fuente, periodo) {
      const fin = Math.floor(Date.now() / 1000);
      const inicio = fin - periodo;
      const g = fuente.intervalos.find(i => periodo / i < fuente.maxVelas - 1) ||
        fuente.intervalos[fuente.intervalos.length - 1];
      const lista = await velasCubriendo(fuente, inicio, fin, g);
      // Si la fuente devuelve bastante menos historia de la pedida, se prueba con la siguiente.
      if (lista.length < (periodo / g) * 0.8) throw new Error(fuente.nombre + " devolvió historia incompleta");
      const [minimo, maximo] = await Promise.all([
        afinar(fuente, buscarExtremo(lista, "bajo", esMenor), "bajo", esMenor),
        afinar(fuente, buscarExtremo(lista, "alto", esMayor), "alto", esMayor)
      ]);
      return { minimo, maximo, fuente: fuente.nombre };
    }

    // El precio actual puede superar a las velas ya consultadas; se incorpora para que no quede incoherente.
    function incluirPrecioActual() {
      if (!extremos || !ultimoPrecio) return;
      const actual = { t: Math.floor(ultimoPrecio.hora.getTime() / 1000), valor: ultimoPrecio.precio, g: 60 };
      // Un precio anterior al inicio del periodo no puede ser su extremo (p. ej. tras horas con la pestaña oculta).
      if (actual.t < Math.floor(extremos.obtenido / 1000) - extremos.periodo) return;
      if (actual.valor < extremos.minimo.valor) extremos.minimo = actual;
      if (actual.valor > extremos.maximo.valor) extremos.maximo = actual;
    }

    function diaLocal(fecha) {
      const opciones = { weekday: "short", day: "numeric", month: "short" };
      if (fecha.getFullYear() !== new Date().getFullYear()) opciones.year = "numeric";
      return fecha.toLocaleDateString("es-EC", opciones);
    }

    const horaLocal = fecha => fecha.toLocaleTimeString("es-EC", { hour: "2-digit", minute: "2-digit" });

    function fechaExtremo(extremo) {
      const desde = new Date(extremo.t * 1000);
      if (extremo.g <= 60) return diaLocal(desde) + "\n" + horaLocal(desde);
      // No se pudo bajar a velas de 1 minuto: se muestra el rango real de la vela en hora local
      // (las velas empiezan en horas UTC, así que su inicio no coincide con el día de Ecuador).
      const hasta = new Date((extremo.t + extremo.g) * 1000);
      if (diaLocal(desde) === diaLocal(hasta)) {
        return diaLocal(desde) + "\nentre " + horaLocal(desde) + " y " + horaLocal(hasta);
      }
      return "entre " + diaLocal(desde) + " " + horaLocal(desde) + "\ny " + diaLocal(hasta) + " " + horaLocal(hasta);
    }

    function mostrarExtremos(fallo) {
      const listos = extremos && extremos.periodo === periodoActual;
      if (!listos) {
        $("minimoValor").textContent = fallo ? "—" : "…";
        $("maximoValor").textContent = fallo ? "—" : "…";
        $("minimoFecha").textContent = "";
        $("maximoFecha").textContent = "";
        $("extremosFuente").textContent = fallo
          ? "No se pudo obtener el histórico. Se reintentará en un minuto."
          : "Buscando…";
        return;
      }
      $("minimoValor").textContent = usd(extremos.minimo.valor);
      $("minimoFecha").textContent = fechaExtremo(extremos.minimo);
      $("maximoValor").textContent = usd(extremos.maximo.valor);
      $("maximoFecha").textContent = fechaExtremo(extremos.maximo);
      $("extremosFuente").textContent = "Fuente: " + extremos.fuente + (fallo ? " · no se pudo actualizar" : "");
    }

    async function actualizarExtremos() {
      const periodo = periodoActual;
      const solicitud = ++solicitudExtremos;
      buscandoExtremos = true;
      mostrarExtremos(false);
      for (const fuente of HISTORICOS) {
        try {
          const resultado = await calcularExtremos(fuente, periodo);
          if (solicitud !== solicitudExtremos) return;
          extremos = {
            minimo: resultado.minimo,
            maximo: resultado.maximo,
            fuente: resultado.fuente,
            periodo,
            obtenido: Date.now()
          };
          incluirPrecioActual();
          buscandoExtremos = false;
          mostrarExtremos(false);
          return;
        } catch (e) {
          if (solicitud !== solicitudExtremos) return;
          // Esta fuente no respondió o vino incompleta; se intenta con la siguiente.
        }
      }
      buscandoExtremos = false;
      if (extremos && extremos.periodo === periodo) incluirPrecioActual();
      mostrarExtremos(true);
    }

    function extremosVencidos() {
      return !buscandoExtremos && (!extremos || extremos.periodo !== periodoActual ||
        Date.now() - extremos.obtenido > REFRESCO_EXTREMOS_MS);
    }

    function marcarPeriodo() {
      document.querySelectorAll(".periodo").forEach(boton => {
        const activo = Number(boton.dataset.periodo) === periodoActual;
        boton.classList.toggle("activo", activo);
        boton.setAttribute("aria-pressed", String(activo));
      });
    }

    // Acepta coma o punto como separador decimal y de miles:
    // "5823,91", "5823.91", "5.823,91", "5,823.91", "102.000" y "102,000" se leen bien.
    function leerNumero(id) {
      const texto = $(id).value.replace(/[\s$]/g, "");
      if (!/^\d[\d.,]*$/.test(texto)) return NaN;
      const i = Math.max(texto.lastIndexOf(","), texto.lastIndexOf("."));
      let normal = texto;
      if (i !== -1) {
        const antes = texto.slice(0, i);
        const despues = texto.slice(i + 1);
        const otro = texto[i] === "," ? "." : ",";
        // Un solo tipo de separador seguido de exactamente 3 dígitos es de miles ("102.000", "1,234,567").
        // En cualquier otro caso el último separador es el decimal ("102000,5", "5.823,91").
        const esMiles = despues.length === 3 && !antes.includes(otro) && antes[0] !== "0";
        normal = esMiles ? texto.replace(/[.,]/g, "") : antes.replace(/[.,]/g, "") + "." + despues;
      }
      if (!/^\d+(\.\d*)?$/.test(normal)) return NaN;
      return Number(normal);
    }

    function mostrarAviso(texto) {
      const aviso = $("aviso");
      aviso.textContent = texto;
      aviso.classList.toggle("visible", Boolean(texto));
    }

    function limpiarResultado() {
      $("datos").hidden = true;
      $("resultado").textContent = "";
      $("porcentaje").textContent = "";
    }

    function mostrarPrecio(precio, detalle) {
      $("precio").textContent = "BTC actual: " + usd(precio);
      $("fuente").textContent = detalle;
    }

    function calcular() {
      guardarDatos();

      const precioManual = leerNumero("precioManual");
      const usarManual = precioManual > 0;
      const precio = usarManual ? precioManual : ultimoPrecio && ultimoPrecio.precio;

      if (usarManual) {
        mostrarPrecio(precioManual, "Precio ingresado manualmente");
      } else if (ultimoPrecio) {
        mostrarPrecio(ultimoPrecio.precio,
          "Fuente: " + ultimoPrecio.fuente + " · " + ultimoPrecio.hora.toLocaleTimeString("es-EC"));
      }

      if (!precio) {
        $("precio").textContent = "";
        $("fuente").textContent = "";
        limpiarResultado();
        return;
      }

      const invertido = leerNumero("invertido");
      const promedio = leerNumero("promedio");

      if (!(invertido > 0) || !(promedio > 0)) {
        limpiarResultado();
        $("resultado").className = "";
        $("resultado").textContent = "Ingresa montos válidos mayores a cero.";
        return;
      }

      // Se parte de (precio - promedio) para que el punto de equilibrio dé 0 exacto,
      // sin residuos de punto flotante que lo muestren como pérdida.
      const variacion = (precio - promedio) / promedio;
      const cantidad = invertido / promedio;
      const diferencia = invertido * variacion;
      const valorActual = invertido + diferencia;
      const porcentaje = variacion * 100;
      const centavos = Math.round(diferencia * 100);
      const clase = centavos > 0 ? "ganancia" : centavos < 0 ? "perdida" : "";

      $("totalInvertido").textContent = usd(invertido);
      $("promedioUsado").textContent = usd(promedio);
      $("cantidad").textContent = cantidad.toFixed(8) + " BTC";
      $("valorActual").textContent = usd(valorActual);
      $("datos").hidden = false;

      $("resultado").className = clase;
      $("porcentaje").className = clase;

      if (centavos === 0) {
        $("resultado").textContent = "Sin utilidad ni pérdida";
        $("porcentaje").textContent = "0.00%";
      } else {
        $("resultado").textContent = (centavos > 0 ? "Utilidad: " : "Pérdida: ") + usd(Math.abs(diferencia));
        $("porcentaje").textContent = (centavos > 0 ? "+" : "") + porcentaje.toFixed(2) + "%";
      }
    }

    async function consultar() {
      if (consultando) return;
      consultando = true;

      const boton = $("consultar");
      boton.disabled = true;
      boton.textContent = "Consultando…";

      try {
        const resultado = await obtenerPrecio();
        // Si no había precio o el último intento falló, el precio manual era solo un respaldo: se descarta.
        const veniaDeFallo = !ultimoPrecio || $("aviso").classList.contains("visible");
        ultimoPrecio = { precio: resultado.precio, fuente: resultado.fuente, hora: new Date() };
        mostrarAviso("");
        if (veniaDeFallo) {
          $("precioManual").value = "";
          $("manual").open = false;
        }
      } catch (e) {
        const hayManual = leerNumero("precioManual") > 0;
        mostrarAviso(hayManual
          ? "No se pudo actualizar el precio automático. Se usa el precio ingresado manualmente."
          : ultimoPrecio
            ? "No se pudo actualizar el precio. Se muestra el último obtenido."
            : "No se pudo obtener el precio de BTC. Revisa tu conexión o ingresa el precio manualmente abajo.");
        if (!ultimoPrecio && !hayManual) $("manual").open = true;
      } finally {
        consultando = false;
        boton.disabled = false;
        boton.textContent = "Consultar BTC";
        calcular();
        if (extremosVencidos()) {
          actualizarExtremos();
        } else if (!buscandoExtremos) {
          incluirPrecioActual();
          mostrarExtremos(false);
        }
      }
    }

    function guardarDatos() {
      try {
        localStorage.setItem(CLAVE_GUARDADO, JSON.stringify({
          invertido: $("invertido").value,
          promedio: $("promedio").value,
          periodo: periodoActual
        }));
      } catch (e) {
        // Sin almacenamiento disponible (modo privado); no es crítico.
      }
    }

    function cargarDatos() {
      try {
        const datos = JSON.parse(localStorage.getItem(CLAVE_GUARDADO));
        if (datos) {
          if (datos.invertido) $("invertido").value = datos.invertido;
          if (datos.promedio) $("promedio").value = datos.promedio;
          if (PERIODOS.includes(datos.periodo)) periodoActual = datos.periodo;
        }
      } catch (e) {
        // Datos guardados ilegibles o almacenamiento bloqueado; se usan los valores por defecto.
      }
    }

    $("consultar").addEventListener("click", () => {
      consultar();
      if (!buscandoExtremos) actualizarExtremos();
    });
    ["invertido", "promedio", "precioManual"].forEach(id => $(id).addEventListener("input", calcular));

    document.querySelectorAll(".periodo").forEach(boton => boton.addEventListener("click", () => {
      periodoActual = Number(boton.dataset.periodo);
      marcarPeriodo();
      guardarDatos();
      actualizarExtremos();
    }));

    setInterval(() => {
      if (!document.hidden) consultar();
    }, REFRESCO_MS);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) consultar();
    });

    cargarDatos();
    marcarPeriodo();
    actualizarExtremos();
    consultar();
  </script>

</body>
</html>
